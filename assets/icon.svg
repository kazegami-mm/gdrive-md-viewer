<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景は透過。角丸カードのみ不透明白 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 浮いた角丸カード -->
  <rect x="56" y="56" width="400" height="400" rx="72" ry="72" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Markdown の M（青）。2本の縦棒 + V字 -->
  <g fill="none" stroke="#1a73e8" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 150 300 L 150 168 L 220 240 L 290 168 L 290 300"/>
  </g>

  <!-- 下向き矢印（緑） -->
  <g fill="#34a853">
    <rect x="338" y="158" width="34" height="92" rx="17"/>
    <path d="M 322 238 L 388 238 L 355 296 Z"/>
  </g>

  <!-- 目（ビューア）のグリフ -->
  <g fill="none" stroke="#5f6368" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 168 360 Q 256 300 344 360 Q 256 420 168 360 Z"/>
  </g>
  <circle cx="256" cy="360" r="30" fill="#5f6368"/>
</svg>
